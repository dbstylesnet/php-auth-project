version: '2'
services:
    web:
        image: nginx:1.13.9
        ports:
            - 5004:80
        volumes:
            - ..:/data
            - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php
    php:
        build: .
        volumes:
            - ..:/data
            - ./php/custom/php.ini:/usr/local/etc/php/conf.d/custom.ini
        working_dir: /data
        expose:
            - 9000
        command: php-fpm -R -y /data/docker/php/php-fpm.conf
        depends_on:
            - db-init
    composer:
        image: composer:1.6.3
        volumes:
            - ..:/app
        command: install
    mysql:
        image: mysql:5.7.21
        ports:
            - 3307:3306 # avoid local mysql port busy
        volumes:
            - ./mysql/scripts:/docker-entrypoint-initdb.d 
            - ./mysql/mysql.d:/etc/mysql/conf.d
            # https://stackoverflow.com/questions/39175194/docker-compose-persistent-data-mysql
            - ../dump:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: ""
            MYSQL_USER: "app"
            MYSQL_PASSWORD: "app"
            MYSQL_DATABASE: "app"
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    db-init:
        image: mysql:5.7.21
        volumes:
            - ..:/data
        entrypoint: ["bash", "-c"]
        command: >
            "
            until mysqladmin ping -h mysql -u app -papp --silent 2>/dev/null; do
                echo 'Waiting for MySQL...'
                sleep 2
            done &&
            echo 'MySQL is ready. Initializing schema...' &&
            mysql -h mysql -u app -papp app <<EOF
            CREATE TABLE IF NOT EXISTS \`user\` (
                \`id\` INT AUTO_INCREMENT PRIMARY KEY,
                \`login\` VARCHAR(255) NOT NULL UNIQUE,
                \`hash\` VARCHAR(255) NOT NULL,
                \`salt\` VARCHAR(255) NOT NULL,
                INDEX \`idx_login\` (\`login\`)
            ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci;
            EOF
            echo 'Database schema initialized successfully!'
            "
        depends_on:
            - mysql

